# AWS environment "ucb-stage1": stage 1 in the UC Berkeley test account (Jira CS-9523). Serena with the simulated
# CollectionSpace and the fake ETL, open to campus networks and the campus VPN, no WAF, no museum data. Throwaway:
# destroyed (./serena aws destroy --env ucb-stage1) once docs/testing-checklist.md section 31 passes. Deployed with
# ./serena aws, no pipeline (D269). Nothing secret here: the account number, ALERT_EMAIL and the campus and VPN
# ranges (ALLOWED_CIDRS) go in ucb-stage1.local.conf, which isn't committed.
# Public test sign-ins: the simulator's admin sign-ins (admin / admin and the others, deploy/README.md) are in this
# public repository, so anyone on campus or the VPN can sign in to stage 1's admin app. Accepted on October 21, 2026,
# since stage 1 holds only synthetic data.

AWS_PROFILE=serena-stage1-deploy  # assumes Ops's SerenaStage1Deployer role from Richard's existing cspace SSO profile (CS-9523)
AWS_REGION=us-west-2
SERENA_ENV_NAME=stage1            # resource names: serena-stage1-...; Terraform state under serena/stage1/
SIMULATED_CSPACE=true
SIMULATED_MUSEUMS="pahma"
ENV_LABEL="AWS · UC Berkeley stage 1 · simulator"
# Every path is open only to ALLOWED_CIDRS (the campus and VPN ranges, in ucb-stage1.local.conf); no WAF; throwaway.
OPEN_IMAGES=false
WAF=false
PROTECT_DATA=false
WEB_COUNT=2                       # as in production (D188), so the task sizes are measured with two web tasks

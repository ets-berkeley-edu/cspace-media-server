# AWS environment "personal-dev": Richard's personal AWS account, for trying Serena's deployment (with the simulated
# CollectionSpace and the fake ETL) before it moves to the UC Berkeley account. The same account as the BMU's
# personal-dev, side by side with it (its own VPC range and names). Read by ./serena aws (deploy/aws.sh). Nothing
# secret here: you sign in with aws sso login --profile <AWS_PROFILE>, and the account number and allowed addresses go
# in personal-dev.local.conf, which isn't committed (./serena aws deploy creates it).

AWS_PROFILE=bmu-personal          # the AWS CLI profile (IAM Identity Center sign-in), from aws configure sso
AWS_REGION=us-west-2
SERENA_ENV_NAME=dev               # resource names: serena-dev-...; Terraform state under serena/dev/
# The simulated CollectionSpace, in the environment, for these museums; ./serena aws etl <museum> runs the fake ETL.
# Add cinefiles to try signed links (deploy sets a random portal key).
SIMULATED_CSPACE=true
SIMULATED_MUSEUMS="pahma"
ENV_LABEL="AWS · personal dev · simulator"
# Off here: the image paths, /etl/ and /admin are open only to ALLOWED_CIDRS (in personal-dev.local.conf), there's no
# WAF, and ./serena aws destroy removes everything.
OPEN_IMAGES=false
WAF=false
PROTECT_DATA=false
WEB_COUNT=1                       # web tasks (2 in QA and production, D188)

# Stage 2: the first build of the shared QA environment (EN1 A, D300), in the UC Berkeley account, on the shared root
# (the split: a public load balancer on a campus domain, CloudFront for the files). First with only the simulator
# museum, deployed by ./serena aws (TQ8); real museums come only with the pipeline (D268). Nothing here is
# sensitive: the account, VPC and subnet IDs, domain and address ranges go in ucb-stage2.local.conf (not committed):
#   ACCOUNT_ID=...                       (asked and saved at the first command)
#   VPC_ID=vpc-...                       Ops's VPC (D303)
#   APP_SUBNET_IDS="subnet-...,subnet-..."   its private subnets, two zones, behind its NAT gateway
#   LB_SUBNET_IDS="subnet-...,subnet-..."    its public subnets, two zones, for the load balancer
#   CREATE_GATEWAY_ENDPOINTS=false       true if the VPC has no S3 and DynamoDB gateway endpoints yet
#   DOMAIN_NAME=...                      the campus name from DevOps (D293)
#   APACHE_CIDRS="..."                   webapps-qa's Apache hosts' outbound addresses (D290, D306)
#   ETL_CIDRS="..."                      the ETL server's addresses; with the simulator, also the NAT gateway's
#   ADMIN_CIDRS="..."                    campus and VPN ranges (they reach the image paths too, TQ6)
#   ALERT_EMAIL=...
AWS_PROFILE=serena-stage2-deploy  # to agree with Ops (the stage 2 permission set, D297)
AWS_REGION=us-west-2
SERENA_ENV_NAME=stage2            # resource names: serena-stage2-...; Terraform state under serena/stage2/
TERRAFORM_ROOT=shared
SIMULATED_CSPACE=true
SIMULATED_MUSEUMS="pahma"
ENV_LABEL="AWS · UC Berkeley stage 2 · simulator"
WAF=true
PROTECT_DATA=false                # the simulator only; true once it holds real data
WEB_COUNT=2

# Production, in the UC Berkeley account, on the shared root (the split: a public load balancer on a campus domain,
# CloudFront for the files). Real data from its first deploy, so only the deploy pipeline deploys it (D268), with a
# reviewer who isn't the person who started the run (never ALLOW_SELF_REVIEW, D308), and only a commit already
# deployed to PREPRODUCTION. The settings are in SSM Parameter Store in its account (D273), the document
# /serena-prod/settings/all, SSM's being the one copy: this file and ucb-prod.local.conf are what ./serena aws
# settings push puts there, for the new environment;
# after that, settings set changes one and settings pull brings the files up to date. Nothing here is sensitive: the
# account, VPC and subnet IDs, domain, servers and address ranges go in ucb-prod.local.conf (not committed):
#   ACCOUNT_ID=...                       (asked and saved at the first command)
#   ADMIN_PROFILE=...                    the administrator's profile: settings push, set and delete; the pipeline
#   VPC_ID=vpc-...                       Ops's VPC (D303)
#   APP_SUBNET_IDS="subnet-...,subnet-..."   its private subnets, two zones, behind its NAT gateway
#   LB_SUBNET_IDS="subnet-...,subnet-..."    its public subnets, two zones, for the load balancer
#   CREATE_GATEWAY_ENDPOINTS=false       true if the VPC has no S3 and DynamoDB gateway endpoints yet
#   DOMAIN_NAME=...                      the campus name from DevOps (D293)
#   CSPACE_TENANTS="pahma=https://..."   each museum and its production CollectionSpace server
#   APACHE_CIDRS="..."                   the production webapps hosts' Apache outbound addresses (D290, D306)
#   ETL_CIDRS="..."                      the production ETL server's addresses
#   ETL_READER_ROLE_ARNS="pahma=arn:aws:iam::...:role/..."   the ETL server's role, once it reads with it (D275)
#   ADMIN_CIDRS="..."                    campus and VPN ranges (they reach the image paths too, TQ6)
#   ALERT_EMAIL=...                      Richard's, until a team mailing list takes his place
AWS_PROFILE=serena-prod-deploy    # to agree with Ops (the deployer permission set, the stage 2 policy, D297)
AWS_REGION=us-west-2
SERENA_ENV_NAME=prod              # resource names: serena-prod-...; Terraform state under serena/prod/
SETTINGS=ssm
TERRAFORM_ROOT=shared
SIMULATED_CSPACE=false
ENV_LABEL="AWS · UC Berkeley production"
WAF=true
PROTECT_DATA=true
WEB_COUNT=2
PREPRODUCTION=ucb-stage2          # the pipeline deploys only a commit already deployed here (the QA environment)

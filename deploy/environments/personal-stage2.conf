# AWS environment "personal-stage2": a rehearsal of stage 2 (checklist section 50) in Richard's personal account, before
# Ops's account (docs/testing-checklist.md, section 54). The shared root with only the simulator museum, deployed as a
# role with only the stage 2 deployer policy (deploy/iam/serena-deployer-policy.json), so that every AccessDenied is the
# policy's. ./serena aws rehearsal-vpc --env personal-stage2 first makes what Ops provides for stage 2 (a VPC with a
# NAT gateway, and that role), as ADMIN_PROFILE, and saves the IDs in personal-stage2.local.conf (not
# committed), with ETL_CIDRS and ADMIN_CIDRS. DOMAIN_NAME (a name in a DNS zone of your own, for the certificate) and
# ALERT_EMAIL go there too. Simulator only: UC Berkeley data never goes in a personal account. About $5 a day while it
# runs, the NAT gateway even when paused: destroy it, then ./serena aws rehearsal-vpc --env personal-stage2 destroy.
# The deploy pipeline is proven on it too (section 56): its build role, with the same policy, then deploys it.

AWS_PROFILE=serena-rehearsal-deploy   # the deployer role, from bmu-personal (rehearsal-vpc prints its ~/.aws/config section)
REHEARSAL=true
ADMIN_PROFILE=bmu-personal            # the account's administrator: the settings, the VPC and deployer, the pipeline
AWS_REGION=us-west-2
SERENA_ENV_NAME=stage2r               # resource names: serena-stage2r-...; Terraform state under serena/stage2r/
TERRAFORM_ROOT=shared
SIMULATED_CSPACE=true
SIMULATED_MUSEUMS="pahma"
ENV_LABEL="AWS · personal stage 2 rehearsal · simulator"
WAF=true
PROTECT_DATA=false
WEB_COUNT=2
CREATE_GATEWAY_ENDPOINTS=true         # the rehearsal's VPC has none, so the deployer's endpoint permissions are tried

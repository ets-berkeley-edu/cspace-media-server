[project]
name = "serena"
version = "0.1.0"
description = "Serena, the media server for UC Berkeley's CollectionSpace museums (replaces the legacy imageserver)"
license = { text = "Copyright The Regents of the University of California. Educational, research and not-for-profit use; see LICENSE" }
requires-python = ">=3.11"
# The dependencies are in requirements.in (the app) and requirements-dev.in (the tests and checks), compiled into the
# hash-pinned requirements files by pin-requirements.sh, so that Dependabot can update them. Serena is always
# installed from those files, then itself with --no-deps.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["serena*", "fakecspace*", "devtools*"]

[tool.setuptools.package-data]
serena = ["museums/*.yaml", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, bandit (security) and ruff's own rules
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest checks

[tool.mypy]
python_version = "3.11"
files = ["serena", "fakecspace", "devtools", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information for these: their values are Any, so code using them keeps its own annotations.
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "defusedxml", "defusedxml.*", "pyvips", "pyvips.*"]
ignore_missing_imports = true

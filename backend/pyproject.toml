[project]
name = "serena"
version = "0.1.0"
description = "Serena, the media server for UC Berkeley's CollectionSpace museums (replaces the legacy imageserver)"
license = { text = "Copyright The Regents of the University of California. Educational, research and not-for-profit use; see LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "boto3>=1.34",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "defusedxml>=0.7",
  "tzdata>=2024.1",  # America/Los_Angeles for a run's night, also where the OS has no time zone database
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "moto[dynamodb,s3,secretsmanager]>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["serena*"]

[tool.setuptools.package-data]
serena = ["museums/*.yaml", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, bandit (security) and ruff's own rules
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest checks

[tool.mypy]
python_version = "3.11"
files = ["serena", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information for these: their values are Any, so code using them keeps its own annotations.
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto"]
ignore_missing_imports = true

# PAHMA: Serena's configuration (design: URLs, Placeholder image, Records). The settings are starting values;
# an admin's value in the admin app overrides them.
key: pahma
name: PAHMA
# Derivatives served, from what the portal can request today (design: URLs; to revisit from the access logs)
derivatives: [Thumbnail, Small, Medium, FullHD, OriginalJpeg]
# Whether the original file (…/blobs/<CSID>/content) is served for images and catalog cards
original: true
# The Blob the ETL lists in place of a non-public image (its "Image restricted" picture). Its CSID isn't a UUID.
placeholder_blob_csid: 59a733dd-d641-4e1a-8552
# The CollectionSpace role that marks a Serena admin (design: Admin web app)
admin_role: Serena_Admin
# The Media record fields Media look up shows from CollectionSpace, beside Serena's records (D140). Serena shows
# them and never decides from them: the ETL's rules decide what's public. PAHMA's ETL reads "Approved for web"
# (media_pahma's approvedforweb), not media_common's publishTo; it also tests the Object record, which isn't shown.
lookup_fields:
  - {part: media_pahma, field: approvedforweb, label: Approved for web}
settings:
  watchdog_deadline: "08:00"          # Pacific time: today's refresh must be updated or abandoned by then
  etl_poll_interval_seconds: 15       # returned to the ETL in every refresh response
  etl_step_timeout_seconds: 1800
  delta_threshold_percent: 5          # the servable list check fails if added + removed + changed rows exceed this percentage
  audit_retention_days: 90             # how long the audit log is kept: 90, 183, 365, 548, 730 or 1095 days
  size_limit_mb:                      # largest file fetched, by kind (starting values, to confirm for production)
    image: 500
    card: 500
    3D: 1024
    pdf: 200

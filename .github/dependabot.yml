# Weekly update pull requests (Mondays), grouped so there are few of them. Each one runs CI like any other PR.
#
# Docker: the local stack's image (backend/Dockerfile), the production image (deploy/Dockerfile) and the images
# docker-compose.yml names. Terraform: the AWS provider in both configurations (deploy/terraform), within ~> 6.0.
#
# Python: the requirements files are pip-compile output of the .in files beside them (backend/pin-requirements.sh, as
# in the BMU); Dependabot reruns pip-compile with the options in each file's header. The dependencies are in the .in
# files, not in pyproject.toml, which Dependabot would bump without regenerating the pinned files (#63, #66, #79). Base images: only patch updates are offered, so Python
# stays on .python-version's 3.11; moving it is a deliberate change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    groups:
      python:
        patterns: ["*"]

  # serenade's own requirements (its Selenium tests run on the Mac, not in the images); missed until October 21, 2026,
  # when its certifi was left behind the backend's (GHSA-6q48-6c7w-9gw2).
  - package-ecosystem: pip
    directory: /serenade
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    groups:
      serenade:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    ignore:
      # As in the BMU: ESLint 10 waits until eslint-plugin-import supports it; TypeScript 7 until typescript-eslint
      # and vue-tsc do; Vuetify 4 is a deliberate upgrade; @types/node follows the Node we run (22).
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "vuetify"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      admin:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /deploy]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    ignore:
      - dependency-name: "*python"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "*node"
        update-types: [version-update:semver-major]
    groups:
      images:
        patterns: ["*"]

  # moto's image (docker-compose.yml) follows the moto the tests pin (requirements-dev.txt): move both together.
  # node's image (the admin app's dev server) stays on 22, the Node CI uses.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    ignore:
      - dependency-name: "node"
        update-types: [version-update:semver-major]
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: [/deploy/terraform/personal, /deploy/terraform/registry]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    groups:
      terraform:
        patterns: ["*"]

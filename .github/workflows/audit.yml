# Every Monday morning (Pacific), and on demand: checks the pinned packages for newly published vulnerabilities, so a
# problem shows up even in a week nobody pushes. CI (ci.yml) runs the same check on every push.
# An npm job joins this one when there is a frontend.
name: Dependency audit
on:
  schedule:
    - cron: "17 14 * * 1"   # 14:17 UTC: 7:17 AM PDT, 6:17 AM PST
  workflow_dispatch:
# The workflow's token can only read the repository: no job here writes to GitHub.
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # UNTIL THE FIRST CODE: there is no backend/ yet. The pull request that adds backend/pyproject.toml removes this
      # step and the `if:` lines below (as in ci.yml).
      - name: Is there code yet? (remove with the first code pull request)
        id: code
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No backend/pyproject.toml yet: no Python packages to audit."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.code.outputs.present == 'true'
        with: { python-version-file: .python-version }
      - if: steps.code.outputs.present == 'true'
        run: pip install --require-hashes -r requirements-tools.txt
      - if: steps.code.outputs.present == 'true'
        run: |
          # The tools are audited apart from the app, as in the BMU: pip-audit refuses a package pinned twice.
          pip-audit --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt
          pip-audit --require-hashes --disable-pip -r requirements-tools.txt

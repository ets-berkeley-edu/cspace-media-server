# Every Monday morning (Pacific), and on demand: checks the pinned packages for newly published vulnerabilities, so a
# problem shows up even in a week nobody pushes. CI (ci.yml) runs the same check on every push.
name: Dependency audit
on:
  schedule:
    - cron: "17 14 * * 1"   # 14:17 UTC: 7:17 AM PDT, 6:17 AM PST
  workflow_dispatch:
# The workflow's token can only read the repository: no job here writes to GitHub.
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version-file: .python-version }
      - run: pip install --require-hashes -r requirements-tools.txt
      - run: |
          # The tools are audited apart from the app, as in the BMU: pip-audit refuses a package pinned twice.
          pip-audit --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt
          pip-audit --require-hashes --disable-pip -r requirements-tools.txt

  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm audit
